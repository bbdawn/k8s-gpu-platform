<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Workload</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
    --text: #1b1f24; --muted: #6b7480; --accent: #2f6feb; --bad: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #e8eefc; color: var(--accent); font-size: 12px; font-weight: 600;
  }
  .badge.cpu { background: #eceef1; color: var(--muted); }
  #drop {
    background: var(--card); border: 2px dashed var(--line); border-radius: 10px;
    padding: 36px 16px; text-align: center; color: var(--muted); cursor: pointer;
  }
  #drop.over { border-color: var(--accent); background: #f2f6ff; color: var(--accent); }
  .cols { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
  .col { flex: 1 1 320px; min-width: 0; background: var(--card);
         border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .col h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  #preview { max-width: 100%; border-radius: 6px; display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; font-weight: 600; }
  td.conf { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OCR Workload <span id="device" class="badge">device 확인 중…</span></h1>
  <div class="sub">영수증 이미지를 올리면 PaddleOCR로 텍스트를 인식합니다. (jpg / jpeg / png)</div>

  <div id="drop">
    이미지를 끌어다 놓거나 클릭해서 선택하세요
    <input type="file" id="file" accept="image/jpeg,image/png" hidden>
  </div>

  <div class="cols">
    <div class="col">
      <h2>업로드한 이미지</h2>
      <img id="preview" alt="" hidden>
      <div id="nopreview" class="sub">아직 이미지가 없습니다.</div>
    </div>
    <div class="col">
      <h2>인식 결과</h2>
      <div id="result">대기 중…</div>
    </div>
  </div>

  <div class="hint">API를 직접 호출하려면 <a href="/docs">/docs</a> (Swagger UI)를 사용하세요.</div>
</div>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const nopreview = document.getElementById("nopreview");
const result = document.getElementById("result");

// Show which device the server actually runs on - the point of this workload.
fetch("/gpu").then(r => r.json()).then(info => {
  const badge = document.getElementById("device");
  const onGpu = info.cuda_available;
  badge.textContent = onGpu ? `${info.ocr_device} · ${info.gpu_name}` : `${info.ocr_device}`;
  badge.className = onGpu ? "badge" : "badge cpu";
}).catch(() => {
  document.getElementById("device").textContent = "device 알 수 없음";
});

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) send(fileInput.files[0]);
});

async function send(file) {
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
  nopreview.hidden = true;
  result.textContent = "인식 중…";

  const body = new FormData();
  body.append("file", file);

  const startedAt = performance.now();
  let response;
  try {
    response = await fetch("/ocr", { method: "POST", body });
  } catch (err) {
    result.innerHTML = `<div class="error">요청 실패: ${err}</div>`;
    return;
  }
  const roundTripMs = performance.now() - startedAt;

  const payload = await response.json();
  if (!response.ok) {
    result.innerHTML = `<div class="error">${response.status} — ${payload.detail}</div>`;
    return;
  }
  render(payload, roundTripMs);
}

function render(payload, roundTripMs) {
  if (payload.count === 0) {
    result.innerHTML = '<div class="sub">인식된 텍스트가 없습니다.</div>';
    return;
  }
  const rows = payload.text.map(item =>
    `<tr><td>${escapeHtml(item.text)}</td><td class="conf">${item.confidence.toFixed(3)}</td></tr>`
  ).join("");

  result.innerHTML = `
    <table><thead><tr><th>텍스트</th><th class="conf">신뢰도</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="stats">
      <b>${payload.count}</b>건 ·
      서버 추론 <b>${payload.elapsed_ms.toFixed(1)}</b>ms ·
      전체 왕복 <b>${roundTripMs.toFixed(1)}</b>ms
    </div>`;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
