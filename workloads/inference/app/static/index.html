<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Workload</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
    --text: #1b1f24; --muted: #6b7480; --accent: #2f6feb; --bad: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #e8eefc; color: var(--accent); font-size: 12px; font-weight: 600;
  }
  .badge.cpu { background: #eceef1; color: var(--muted); }
  #drop {
    background: var(--card); border: 2px dashed var(--line); border-radius: 10px;
    padding: 36px 16px; text-align: center; color: var(--muted); cursor: pointer;
  }
  #drop.over { border-color: var(--accent); background: #f2f6ff; color: var(--accent); }
  #summary { margin-top: 16px; color: var(--muted); }
  #summary b { color: var(--text); font-variant-numeric: tabular-nums; }
  .card { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card .thumbwrap { flex: 0 0 140px; }
  .card .body { flex: 1 1 260px; min-width: 0; }
  .card h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb { width: 140px; border-radius: 6px; display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; font-weight: 600; }
  td.conf { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OCR Workload <span id="device" class="badge">device 확인 중…</span></h1>
  <div class="sub">영수증 이미지를 올리면 PaddleOCR로 텍스트를 인식합니다. 여러 장을 한 번에 올릴 수 있습니다. (jpg / jpeg / png)</div>

  <div id="drop">
    이미지를 끌어다 놓거나 클릭해서 선택하세요 · 여러 장 선택 가능
    <input type="file" id="file" accept="image/jpeg,image/png" multiple hidden>
  </div>

  <div id="summary"></div>
  <div id="cards"></div>

  <div class="hint">API를 직접 호출하려면 <a href="/docs">/docs</a> (Swagger UI)를 사용하세요.</div>
</div>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const summary = document.getElementById("summary");
const cards = document.getElementById("cards");

// Show which device the server actually runs on - the point of this workload.
fetch("/gpu").then(r => r.json()).then(info => {
  const badge = document.getElementById("device");
  const onGpu = info.cuda_available;
  badge.textContent = onGpu ? `${info.ocr_device} \u00b7 ${info.gpu_name}` : info.ocr_device;
  badge.className = onGpu ? "badge" : "badge cpu";
}).catch(() => {
  document.getElementById("device").textContent = "device \uc54c \uc218 \uc5c6\uc74c";
});

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  sendAll(e.dataTransfer.files);
});
fileInput.addEventListener("change", () => sendAll(fileInput.files));

/**
 * One request per image, all in flight at once.
 * The server decides how many actually run in parallel (OCR_MAX_CONCURRENCY),
 * so the wall-clock total below reflects real queueing behaviour.
 */
async function sendAll(fileList) {
  const files = Array.from(fileList);
  if (files.length === 0) return;

  cards.innerHTML = "";
  summary.innerHTML = `<b>${files.length}</b>\uc7a5 \uc778\uc2dd \uc911\u2026`;

  const startedAt = performance.now();
  const results = await Promise.all(files.map(file => sendOne(file)));
  const wallClockMs = performance.now() - startedAt;

  const ok = results.filter(r => r.payload);
  const totalTexts = ok.reduce((sum, r) => sum + r.payload.count, 0);
  const totalInferenceMs = ok.reduce((sum, r) => sum + r.payload.elapsed_ms, 0);

  summary.innerHTML =
    `<b>${ok.length}</b>/<b>${files.length}</b>\uc7a5 \uc131\uacf5 \u00b7 ` +
    `\ud14d\uc2a4\ud2b8 <b>${totalTexts}</b>\uac74 \u00b7 ` +
    `\ucd94\ub860 \ud569\uacc4 <b>${totalInferenceMs.toFixed(1)}</b>ms \u00b7 ` +
    `\uc2e4\uc81c \uacbd\uacfc <b>${wallClockMs.toFixed(1)}</b>ms`;
}

async function sendOne(file) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="thumbwrap"><img class="thumb" alt=""></div>
    <div class="body"><h2></h2><div class="slot">\uc778\uc2dd \uc911\u2026</div></div>`;
  card.querySelector(".thumb").src = URL.createObjectURL(file);
  card.querySelector("h2").textContent = file.name;
  cards.appendChild(card);

  const slot = card.querySelector(".slot");
  const body = new FormData();
  body.append("file", file);

  const startedAt = performance.now();
  let response;
  try {
    response = await fetch("/ocr", { method: "POST", body });
  } catch (err) {
    slot.innerHTML = `<div class="error">\uc694\uccad \uc2e4\ud328: ${escapeHtml(String(err))}</div>`;
    return { file, payload: null };
  }
  const roundTripMs = performance.now() - startedAt;

  const payload = await response.json();
  if (!response.ok) {
    slot.innerHTML = `<div class="error">${response.status} \u2014 ${escapeHtml(String(payload.detail))}</div>`;
    return { file, payload: null };
  }

  slot.innerHTML = renderResult(payload, roundTripMs);
  return { file, payload };
}

function renderResult(payload, roundTripMs) {
  const stats =
    `<div class="stats"><b>${payload.count}</b>\uac74 \u00b7 ` +
    `\ucd94\ub860 <b>${payload.elapsed_ms.toFixed(1)}</b>ms \u00b7 ` +
    `\uc751\ub2f5 <b>${roundTripMs.toFixed(1)}</b>ms</div>`;

  if (payload.count === 0) {
    return `<div class="sub">\uc778\uc2dd\ub41c \ud14d\uc2a4\ud2b8\uac00 \uc5c6\uc2b5\ub2c8\ub2e4.</div>${stats}`;
  }
  const rows = payload.text.map(item =>
    `<tr><td>${escapeHtml(item.text)}</td><td class="conf">${item.confidence.toFixed(3)}</td></tr>`
  ).join("");
  return `<table><thead><tr><th>\ud14d\uc2a4\ud2b8</th><th class="conf">\uc2e0\ub8b0\ub3c4</th></tr></thead>` +
         `<tbody>${rows}</tbody></table>${stats}`;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
